baseURL: https://tobias-rothmann.github.io/
languageCode: en-us
title: Tobias Rothmann

theme: PaperMod
params:
  comments: false
  math: true
  hideFooter: true
  profileMode:
    enabled: true
    title: "Tobias Rothmann" # optional default will be site title
    subtitle: "
    Cryptography, Complexity, Formal Methods 

   <br><br>

    I am a master's student in computer science at TUM, interested in formal methods, cryptography, and especially their intersection. I am currently an intern at the Ethereum Foundation, where I work on end-to-end formal verification of post-quantum lattice-based polynomial commitments, from Rust implementations to security proofs.

    <br><br>
    Previously, I formalized functional commitments in <a href='https://github.com/Verified-zkEVM/ArkLib'>Lean/ArkLib</a> at EPFL in the lab of Alessandro Chiesa.
    Prior to that, I was fortunate to be supervised by <a href='https://www21.in.tum.de/~nipkow/'>Prof. Tobias Nipkow</a>, and to have worked on the cryptography team at <a href='https://www.arcium.com'>Arcium</a>. 
    "
    imageUrl: "image.jpeg" # optional
    imageTitle: "<title of image as alt>" # optional
    imageWidth: 180 # custom size
    imageHeight: 180 # custom size
    buttons:
      - name: Papers & Talks
        url: papers/
      - name: Projects
        url: projects/

  socialIcons: # optional
