baseURL: https://tobias-rothmann.github.io/
languageCode: en-us
title: Tobias Rothmann

theme: PaperMod
params:
  comments: false
  math: true
  hideFooter: true
  profileMode:
    enabled: true
    title: "Tobias Rothmann" # optional default will be site title
    subtitle: "

    I am a master's student in computer science at TUM, interested in formal methods, cryptography, and especially their intersection. 

    <br><br>
    Currently, I am interning at the <a href='https://ethereum.org/foundation/'>Ethereum Foundation</a>, where I work on (almost) end-to-end formal verification of post-quantum lattice-based polynomial commitments (from Rust implementations to security proofs).

    <br><br>
    During my undergraduate studies, I was fortunate to be supervised by <a href='https://www21.in.tum.de/~nipkow/'>Prof. Tobias Nipkow</a> (co-author of the Isabelle proof assitant). I worked on <a href='https://github.com/Verified-zkEVM/ArkLib'>ArkLib in Lean</a> at EPFL in the lab of Alessandro Chiesa and I have also worked on the cryptography team at <a href='https://www.arcium.com'>Arcium</a>. 
    "
    imageUrl: "image.jpeg" # optional
    imageTitle: "<title of image as alt>" # optional
    imageWidth: 180 # custom size
    imageHeight: 180 # custom size
    buttons:
      - name: Papers & Talks
        url: papers/
      - name: Projects
        url: projects/

  socialIcons: # optional
    - name: Github
      url: https://github.com/tobias-rothmann
    - name: LinkedIn
      url: https://www.linkedin.com/in/tobias-rothmann/
    - name: Bluesky
      url: https://bsky.app/profile/tobiasrth.bsky.social
    - name: Email
      url: mailto:tobias.rothmann@tum.de

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
